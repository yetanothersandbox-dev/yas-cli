# Cut a release and point the Homebrew tap at it.
#
# Triggered by a tag. The tag is the version the binaries claim, checked before
# anything is built — a dirty tree or a tag that is not on HEAD produces
# binaries that build, ship, and report a version nobody can map to a commit.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: the tag to build and publish
        required: true

permissions:
  contents: write

jobs:
  release:
    name: build, publish, and update the tap
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # Full history: VERSION comes from `git describe --tags`, and a shallow
      # clone with no tags describes the commit instead.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }

      - name: the tag must be the version the binaries claim
        run: |
          got="$(git describe --tags --always --dirty)"
          if [ "$TAG" != "$got" ]; then
            echo "::error::the tag is $TAG and the build would stamp $got."
            echo "That happens when the tag is not on HEAD, or the tree is dirty."
            exit 1
          fi
          echo "building $TAG"

      - run: make test
      - run: make dist

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        # --verify-tag: refuse to invent a tag that is not already pushed.
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            build/dist/*.tar.gz build/dist/checksums.txt

      # The tap is updated from the SAME checksums file the archives were
      # hashed into, in the same job. A formula whose sha256 came from a
      # different run is a formula that fails on somebody else's machine with
      # a checksum mismatch and no explanation.
      - name: update the Homebrew tap
        env:
          # A token with contents:write on the tap repo, set as an ORG secret.
          #
          # An org secret has a VISIBILITY, and this repository is public — a
          # secret scoped to "private repositories" simply arrives empty here,
          # with no error anywhere. That is the failure this step is written to
          # catch, because its symptom is otherwise invisible: releases keep
          # publishing and `brew install` quietly keeps serving the old version.
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::TAP_TOKEN is empty, so the tap was not updated and `brew install` still serves the previous version."
            echo "The release itself published fine — only the formula is stale."
            echo "Most likely: the org secret's visibility excludes public repositories, and this repo is public."
            echo "Check Settings > Secrets and variables > Actions on the org, and give TAP_TOKEN access to yas-cli."
            exit 1
          fi
          version="${TAG#v}"
          sha() { grep " yas_${TAG}_$1.tar.gz\$" build/dist/checksums.txt | awk '{print $1}'; }
          da="$(sha darwin_arm64)"; dx="$(sha darwin_amd64)"
          la="$(sha linux_arm64)";  lx="$(sha linux_amd64)"
          for v in "$da" "$dx" "$la" "$lx"; do
            [ -n "$v" ] || { echo "::error::a checksum is missing from build/dist/checksums.txt"; exit 1; }
          done

          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/yetanothersandbox-dev/homebrew-tap.git" tap
          mkdir -p tap/Formula
          base="https://github.com/yetanothersandbox-dev/yas-cli/releases/download/${TAG}"
          cat > tap/Formula/yas.rb <<RUBY
          # Generated by yas-cli's release workflow. Do not edit by hand: the
          # checksums come from the same run that built the archives.
          class Yas < Formula
            desc "Firecracker microVMs you can throw away and get back"
            homepage "https://yetanothersandbox.dev"
            version "${version}"
            license "MIT"

            on_macos do
              on_arm do
                url "${base}/yas_${TAG}_darwin_arm64.tar.gz"
                sha256 "${da}"
              end
              on_intel do
                url "${base}/yas_${TAG}_darwin_amd64.tar.gz"
                sha256 "${dx}"
              end
            end

            on_linux do
              on_arm do
                url "${base}/yas_${TAG}_linux_arm64.tar.gz"
                sha256 "${la}"
              end
              on_intel do
                url "${base}/yas_${TAG}_linux_amd64.tar.gz"
                sha256 "${lx}"
              end
            end

            def install
              bin.install "yas"
            end

            test do
              assert_match "yas", shell_output("#{bin}/yas version")
            end
          end
          RUBY
          cd tap
          git config user.name "yas release"
          git config user.email "noreply@yetanothersandbox.dev"
          git add Formula/yas.rb
          if git diff --cached --quiet; then
            echo "the tap already points at ${TAG}"
            exit 0
          fi
          git commit -m "yas ${TAG}"
          # No `|| true`. A push refused for want of permission is the same
          # invisible staleness as an empty token, and the whole point of this
          # step is that it cannot fail quietly.
          git push
          echo "the tap now points at ${TAG}"
